<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata — Arilia Putri Adri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-start: #fff0f5;
            --bg-mid: #ffe4ee;
            --bg-end: #ffd6e7;
            --surface: rgba(255, 255, 255, 0.78);
            --surface-border: rgba(255, 255, 255, 0.9);
            --primary: #371de1;
            --primary-soft: #fce7f3;
            --text-main: #1f172a;
            --text-muted: #64586c;
            --shadow-card: 0 24px 48px -12px rgba(225, 29, 99, 0.16), 0 8px 20px -8px rgba(31, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text-main);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Blobs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.65;
            animation: float 10s ease-in-out infinite alternate;
        }

        .bg-orb--1 {
            width: 340px;
            height: 340px;
            background: #ff9ec4;
            top: -80px;
            left: -80px;
        }

        .bg-orb--2 {
            width: 300px;
            height: 300px;
            background: #f9a8d4;
            bottom: -90px;
            right: -60px;
            animation-delay: -4s;
        }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(24px, 18px) scale(1.08); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Main Card */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
            animation: fadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 32px;
            right: 32px;
            height: 4px;
            background: linear-gradient(90deg, #f472b6, #e11d63, #fb7185);
            border-radius: 0 0 999px 999px;
        }

        /* Header */
        .card-header {
            text-align: center;
            margin-bottom: 26px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Info List */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(225, 29, 99, 0.08);
            border-radius: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .info-item:hover {
            transform: translateY(-2px);
            border-color: rgba(225, 29, 99, 0.22);
            box-shadow: 0 8px 18px -6px rgba(225, 29, 99, 0.12);
        }

        .info-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            display: grid;
            place-items: center;
        }

        .info-content {
            text-align: left;
            min-width: 0;
        }

        .info-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        /* CTA Button */
        .btn-instagram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #f58529 0%, #dd2a7b 55%, #8134af 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 12px 24px -8px rgba(221, 42, 123, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 28px -8px rgba(221, 42, 123, 0.55);
            filter: brightness(1.05);
        }

        .btn-instagram:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 22px;
                border-radius: 24px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb--1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--2" aria-hidden="true"></div>

    <main class="card">
        <header class="card-header">
            <h1>Profil Mahasiswa</h1>
            <p class="subtitle">Identitas Akademik</p>
        </header>

        <section class="info-list" aria-label="Biodata Mahasiswa">
            <div class="info-item">
                <div class="info-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="info-content">
                    <span class="info-label">Nama Lengkap</span>
                    <span class="info-value">Muh Daffa Khairon Ilham</span>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <line x1="7" y1="9" x2="17" y2="9"></line>
                        <line x1="7" y1="13" x2="13" y2="13"></line>
                    </svg>
                </div>
                <div class="info-content">
                    <span class="info-label">Nomor Induk Mahasiswa</span>
                    <span class="info-value">53025031</span>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                        <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                    </svg>
                </div>
                <div class="info-content">
                    <span class="info-label">Program Studi</span>
                    <span class="info-value">Bisnis Digital </span>
                </div>
            </div>
        </section>

        <a class="btn-instagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            Kunjungi Instagram Saya
        </a>
    </main>
</body>
</html>
